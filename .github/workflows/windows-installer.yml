name: Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Smoke test installed Python dependencies
        shell: pwsh
        run: |
          $AppRoot = Join-Path $env:RUNNER_TEMP 'ShopAI'
          New-Item -ItemType Directory -Force -Path "$AppRoot\scripts" | Out-Null
          Copy-Item backend, orchestrator -Destination $AppRoot -Recurse
          Copy-Item installer\windows\install-backend.ps1 -Destination "$AppRoot\scripts"
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$AppRoot\scripts\install-backend.ps1"
          if ($LASTEXITCODE -ne 0) { throw 'ShopAI dependency smoke test failed.' }
          if (-not (Test-Path "$env:LOCALAPPDATA\ShopAI\install-complete")) {
            throw 'ShopAI dependency installation did not complete.'
          }

      - name: Build installer
        run: |
          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          iscc installer\windows\ShopAI.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ShopAI-Windows-Installer
          path: dist/windows/ShopAI-Setup.exe
          if-no-files-found: error
